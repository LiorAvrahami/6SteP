name: check

# A build of a working branch, to see that everything builds before it goes to main: the shared engine's tests, the
# Android app and the web front, with the very command of the release build (build.yml, on main). The release variant on
# purpose: only it merges all classes into one, and so only it fails when the app and the shared engine both have a
# class of the same name (2026-11-20: a debug build passed here and the release build on main then failed). It
# publishes nothing.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'app/**'
      - 'shared/**'
      - 'web/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # tools/ci_build.sh: the one Gradle run, repeated when the package sites did not deliver
      - name: The engine's tests, the Android app and the web front
        run: bash tools/ci_build.sh
