name: check

# A build of a working branch, to see that everything compiles before it goes to main: the shared engine's tests, the
# Android app (debug) and the web front. It publishes nothing; the release build is build.yml, on main.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'app/**'
      - 'shared/**'
      - 'web/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: The engine's tests, the Android app and the web front
        run: gradle :shared:jvmTest assembleDebug :web:jsBrowserDistribution --no-daemon --stacktrace
