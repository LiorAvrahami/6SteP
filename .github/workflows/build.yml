name: build

on:
  push:
    branches: [main, spotify-sync-test]
    # only changes to the app make a new APK; the PC-side tools and the docs (dance/, music/, tools/, *.md) do not
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build the signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk 6SteP.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          # a test branch's build is a pre-release, tagged on its own commit, so main's latest release stays the latest
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' }}
          name: 6SteP build ${{ github.run_number }}${{ github.ref_name != 'main' && format(' ({0})', github.ref_name) || '' }}
          body: |
            Download 6SteP.apk below and open it on the phone. The first time, Android asks to allow installing unknown apps from your browser.
            Each build installs over the previous one.
          files: 6SteP.apk
