name: build

on:
  push:
    branches: [main]
    # only changes to the app (its own module, the shared engine, the web front) make a new build; the PC-side tools and
    # the docs (dance/, music/, tools/, *.md) do not
    paths:
      - 'app/**'
      - 'shared/**'
      - 'web/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/**'
  workflow_dispatch:

# One build of a branch at a time, in the order of the pushes. Two pushes close together used to build side by side, and
# the older commit's build, finishing last, became the "latest" release (v45 after v46, 2026-11-16). Now the second
# waits for the first; a third push replaces the one that is waiting (its commit is inside the newer one anyway).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # the shared engine's tests first: a composition that cannot be danced must not reach a release
      # (tools/ci_build.sh: the one Gradle run, repeated when the package sites did not deliver)
      - name: Test the engine, build the signed release APK and the web front
        run: bash tools/ci_build.sh
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk 6SteP.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          # the tag marks the commit that was built, not wherever the branch has moved to since
          target_commitish: ${{ github.sha }}
          name: 6SteP build ${{ github.run_number }}
          body: |
            Download 6SteP.apk below and open it on the phone. The first time, Android asks to allow installing unknown apps from your browser.
            Each build installs over the previous one.
          files: 6SteP.apk

      # the web front, with the dance data and the music, becomes the gh-pages branch, which GitHub Pages serves at
      # https://lioravrahami.github.io/6SteP/ (one commit, replaced at every build, so the branch does not grow)
      - name: Publish the web front
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/build/dist/js/productionExecutable
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: The web front of build ${{ github.run_number }}
