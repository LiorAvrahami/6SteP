<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swing5 skeleton editor</title>
<style>
  :root { --leader: #2e6ee6; --follower: #eb50a0; --bg: #f8f6f0; --ink: #222; --muted: #777; }
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, Segoe UI, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  #app { display: grid; grid-template-columns: 1fr 400px; height: 100vh; }
  #floorWrap { position: relative; min-width: 0; }
  #floor { width: 100%; height: 100%; display: block; background: #fff; cursor: crosshair; }
  #videoWrap { position: absolute; right: 12px; bottom: 12px; width: 640px; max-width: 60%; background: #111; border-radius: 6px; box-shadow: 0 4px 18px rgba(0,0,0,.35); display: none; }
  #videoWrap video { width: 100%; display: block; border-radius: 6px 6px 0 0; }
  #videoBar { display: flex; justify-content: space-between; align-items: center; color: #ddd; font-size: 12px; padding: 4px 8px; }
  #videoBar button { padding: 2px 8px; }
  #side { border-left: 1px solid #ddd; display: flex; flex-direction: column; min-height: 0; background: #fafafa; overflow-y: auto; }
  #side header { padding: 10px 12px; border-bottom: 1px solid #e3e3e3; }
  #mode { display: flex; gap: 0; margin-bottom: 8px; }
  #mode button { flex: 1; border-radius: 0; }
  #mode button:first-child { border-radius: 4px 0 0 4px; } #mode button:last-child { border-radius: 0 4px 4px 0; }
  #mode button.on { background: #2e6ee6; color: #fff; border-color: #2e6ee6; }
  #side select, #side input { font: inherit; padding: 4px; }
  #element { width: 100%; }
  #variantRow { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
  #variant { flex: 1; min-width: 120px; }
  #variantLabel { color: var(--ink); white-space: nowrap; }
  #compList li .cond { color: var(--muted); font-size: 11px; white-space: nowrap; }
  #compList li .sub { color: #7a4b00; font-size: 11px; }
  .mapBox .grp { color: #7a4b00; font-size: 11px; display: block; }
  #buttons, #elemEdit { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  #elemEdit { margin-top: 6px; }
  #elemEdit .mirrorChk { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; white-space: nowrap; cursor: pointer; }
  #elemEdit .sep { width: 1px; height: 22px; background: #ddd; margin: 0 2px; }
  button { font: inherit; padding: 5px 10px; border: 1px solid #bbb; background: #fff; border-radius: 4px; cursor: pointer; }
  button:hover { background: #f0f0f0; }
  button:disabled { opacity: .45; cursor: default; }
  #saveComps.dirty { border-color: #d33; color: #d33; font-weight: 600; }
  #play.on { background: #1a9c4a; color: #fff; border-color: #1a9c4a; }
  #help { min-width: 32px; }
  #status { color: var(--muted); font-size: 12px; margin-top: 6px; min-height: 16px; white-space: pre-wrap; }
  #stale { display: none; background: #fff0f0; color: #a11; border-bottom: 1px solid #f1c4c4; padding: 8px 12px; font-size: 13px; }
  #compEdit { display: none; padding: 8px 12px; border-bottom: 1px solid #e3e3e3; background: #f6f6f2; }
  #compEdit .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  #compEdit label { font-size: 12px; color: var(--muted); }
  #compName { flex: 1; min-width: 120px; }
  #compRepeat { width: 50px; }
  #compList { list-style: none; margin: 0; padding: 0; }
  #compList li { display: flex; align-items: center; gap: 4px; padding: 2px 0; font-size: 13px; }
  #compList li .n { color: var(--muted); font-size: 11px; width: 18px; text-align: right; }
  #compList li .name { flex: 1; }
  #compList li select.endSel { font-size: 12px; padding: 1px 2px; max-width: 120px; }
  #compList li button { padding: 0 6px; font-size: 12px; line-height: 1.5; }
  #addElement { flex: 1; min-width: 160px; }
  #map { display: none; padding: 8px 12px; border-bottom: 1px solid #e3e3e3; background: #f3f3f0; }
  #map h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
  #mapStrip { display: flex; flex-wrap: wrap; gap: 4px; max-height: 18vh; overflow: auto; }
  .mapBox { border: 1px solid #bbb; border-radius: 4px; padding: 3px 7px; font-size: 12px; background: #fff; cursor: pointer; line-height: 1.25; }
  .mapBox:hover { background: #eef3ff; }
  .mapBox.on { border-color: #2e6ee6; background: #e2ebff; }
  .mapBox .n { color: var(--muted); font-size: 11px; }
  .mapBox .st { color: var(--muted); font-size: 11px; display: block; }
  .err { color: #c22; font-size: 12px; margin-top: 4px; }
  #flow { flex: 1 0 180px; overflow: auto; min-height: 180px; }
  table { border-collapse: collapse; width: 100%; }
  tr.step { cursor: pointer; }
  tr.step:hover { background: #f0f4ff; }
  tr.step.sel { background: #e2ebff; }
  tr.step.sel.last { outline: 2px solid #6a8dff; outline-offset: -2px; }
  tr.step.elemStart td { border-top: 2px solid #c9c9c9; }
  td, th { padding: 3px 6px; border-bottom: 1px solid #eee; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th { text-align: left; color: var(--muted); font-weight: 500; position: sticky; top: 0; background: #fafafa; }
  td.L { color: var(--leader); font-weight: 600; } td.F { color: var(--follower); font-weight: 600; }
  td.num { text-align: right; }
  td.el { color: #555; font-size: 12px; }
  td.ed { cursor: text; } td input.cellEdit { width: 64px; font: inherit; padding: 1px 3px; }
  #ctxMenu { position: fixed; display: none; z-index: 20; background: #fff; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.2); padding: 4px 0; min-width: 220px; }
  #ctxMenu div { padding: 5px 14px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  #ctxMenu div:hover { background: #e2ebff; }
  #ctxMenu div.off { color: #aaa; cursor: default; background: none; }
  #overlay { position: absolute; top: 12px; left: 12px; width: min(640px, calc(100% - 24px)); max-height: calc(100% - 24px); display: none; flex-direction: column;
             background: #fff; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: 5; }
  #ovHead { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #eee; gap: 8px; }
  #ovBody { padding: 10px 14px 14px; overflow: auto; white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
  #ovBody.mono { font: 12px/1.4 ui-monospace, Consolas, monospace; }
  #ovBody.form { white-space: normal; }
  #ovBody.form .f { display: grid; grid-template-columns: 120px 1fr; gap: 8px 10px; align-items: center; }
  #ovBody.form label { color: var(--muted); font-size: 13px; }
  #ovBody.form input, #ovBody.form select { font: inherit; padding: 4px 6px; box-sizing: border-box; min-width: 0; }
  #ovBody.form .two { display: flex; gap: 6px; } #ovBody.form .two select { flex: 1; }
  #ovBody.form .hint { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  #ovBody.form .msg { grid-column: 1 / -1; color: #c22; font-size: 13px; min-height: 18px; }
  #ovBody.form .act { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<div id="app">
  <div id="floorWrap">
    <canvas id="floor"></canvas>
    <div id="videoWrap"><video id="video" controls></video><div id="videoBar"><span id="videoName"></span><button id="videoClose">close</button></div></div>
    <div id="overlay"><div id="ovHead"><b id="ovTitle"></b><button id="ovClose" title="close (Esc)">close</button></div><div id="ovBody"></div></div>
  </div>
  <div id="side">
    <div id="stale"></div>
    <header>
      <div id="mode"><button id="modeElements" class="on">elements</button><button id="modeCompositions">compositions</button></div>
      <select id="element"></select>
      <div id="variantRow"><label for="variant">starting condition</label><select id="variant"></select><span id="variantLabel"></span></div>
      <div id="buttons">
        <button id="play" title="plays the dance on the floor in a loop, with the music (space)">play</button>
        <select id="stitch" title="experiment: how two elements join. The leader's weight-bearing foot always keeps its place and orientation across the join; the follower: from the leader = her steps land where the next element's start position says, even if that makes her feet jump; her first step from her own foot = her first step of the next element is placed from her own weight-bearing foot, later steps from the leader; no snapping = all her steps from her own foot"><option value="leader">join: from the leader</option><option value="first">join: her first step from her own foot</option><option value="none">join: no snapping</option><option value="centre">join: the couple's middle and direction</option></select>
        <select id="track" title="track"><option value="hot">Hot Swing 144</option><option value="sunday">Sunday Reflection 127</option><option value="slow">Slow Your Roll 123</option></select>
        <button id="render" title="renders an mp4 with ffmpeg">render video</button>
        <button id="undo" title="undo (ctrl-z)">undo</button>
        <button id="fit" title="fit the floor to the element">fit view</button>
        <button id="check" title="runs the rule checker (python dance/check.py)">check</button>
        <button id="help" title="how to use the editor">?</button>
      </div>
      <div id="elemEdit">
        <button id="newElem" title="a new element, or a new starting condition of an existing one">new element…</button>
        <button id="editElem" title="name, where it starts and ends">edit…</button>
        <button id="deleteElem" title="delete this starting condition of the element (ctrl-z brings it back)">delete</button>
        <span class="sep"></span>
        <button id="addTriple" title="adds a triple step after the selection: three counts (N, N&amp;, N+1), each dancer's free foot, the other foot, the first again, all in place; then drag the feet">add triple</button>
        <button id="halfAfter" title="the selected count becomes a half count after the previous one (3 -> 2& after 2, 5 -> 4 after 3&), and every later count moves by the same amount">&frac12; after previous</button>
        <button id="removeSteps" title="removes the selected steps (Delete key; ctrl-z brings them back)">remove steps</button>
        <span class="sep"></span>
        <label class="mirrorChk" title="ticked: every change to a leader step also puts her matching foot in the reflected place (his left foot is her right, reflected across the line halfway between them at the start); changes to her steps do not touch his. Ticking and unticking change nothing by themselves."><input type="checkbox" id="mirrorChk"> follower mirrors leader</label>
      </div>
      <div id="status"></div>
    </header>
    <div id="compEdit">
      <div class="row"><label>name</label><input id="compName" type="text"><label>from</label><select id="compState"><option value="side">side</option><option value="facing">facing</option><option value="reversed_side">reversed_side</option></select><label>x</label><input id="compRepeat" type="number" min="1" max="50" value="1"></div>
      <div class="row"><label><input id="compKind" type="checkbox"> sub-composition (a building block other compositions use by name)</label></div>
      <ol id="compList"></ol>
      <div class="row"><select id="addElement"></select><label>x</label><input id="addTimes" type="number" min="1" max="99" value="1" style="width:46px"><button id="addElementBtn">add</button></div>
      <div class="row"><button id="newComp">new composition</button><button id="deleteComp">delete</button><button id="saveComps">save compositions</button></div>
      <div id="compErr" class="err"></div>
    </div>
    <div id="map"><h4>map of the composition (click an element to select its steps)</h4><div id="mapStrip"></div></div>
    <div id="flow"><table><thead id="head" title="right-click: insert a count before the first"></thead><tbody id="rows"></tbody></table></div>
    <div id="ctxMenu"></div>
  </div>
</div>
<script>
(function () {
  const FOOT_LEN = 26.4, HEEL_AXIS = 8.7;   // a foot turns about the centre of its heel, 8.7 cm behind the shoe's centre (user 2026-10-25)
  const RAMP = 0.3, RAMP_FRACTION = 0.45, DEFAULT_SWING = 0.67, SHIFT = 0.3;   // SHIFT: neutral stance to the standing foot
  const COL = { L: '#2e6ee6', F: '#eb50a0' };
  let data = null, ei = 0;
  let mode = 'elements';
  let comps = [], subs = [], ci = 0, compView = null, compsDirty = false;
  let listKind = 'composition';   // which list the dropdown shows and the editor edits: 'composition' | 'sub'
  function compList() { return listKind === 'sub' ? subs : comps; }
  // an entry: "name x N → ending" inside optional quiet parentheses (model.parse_entry_full and the app's Entry.parse read it the
  // same way); the ending pins the version when several start alike (2026-10-25)
  function parseEntryFull(entry) { let t = String(entry).trim(), quiet = false;
    if (t.length > 2 && t[0] === '(' && t[t.length - 1] === ')') { t = t.slice(1, -1).trim(); quiet = true; }   // (quiet) entries: the phone does not announce them
    let end = null; const em = t.match(/\s*(?:→|->)\s*([A-Za-z_]+)\s*$/); if (em) { end = em[1]; t = t.slice(0, em.index).trim(); }
    const m = t.match(/^(.*?)\s*(?:[xX×]\s*(\d+))?\s*$/); return { name: m[1].trim(), times: Math.max(1, parseInt(m[2] || '1', 10)), end, quiet }; }
  function parseEntry(entry) { const p = parseEntryFull(entry); return [p.name, p.times]; }
  function makeEntry(p) { const t = p.name + (p.times > 1 ? ' x' + p.times : '') + (p.end ? ' → ' + p.end : ''); return p.quiet ? '(' + t + ')' : t; }
  let sel = { start: 0, len: 1 };
  let view = { cx: 0, cy: 0, scale: 3 };
  let drag = null, undo = [], dirty = false;
  const cv = document.getElementById('floor'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  const fwd = h => { const r = h * Math.PI / 180; return [Math.sin(r), Math.cos(r)]; };
  const right = h => { const r = h * Math.PI / 180; return [Math.cos(r), -Math.sin(r)]; };
  const norm = a => ((a + 180) % 360 + 360) % 360 - 180;
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const smoothstep = u => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // ---------- the current step list: an element, or a composition's composed timeline (read-only on the floor)
  function elem() {
    if (mode === 'elements') return data.elements[ei];
    const c = compList()[ci];
    if (!c) return { name: '(no composition)', start_state: 'side', end_state: 'side', beats: 0, steps: [], hands: [], composition: true };
    return { name: c.name, start_state: c.start_state, end_state: compView ? compView.end_state : c.start_state,
             beats: compView ? compView.length : 0, steps: compView ? compView.steps : [], hands: [], composition: true };
  }
  function startFeet() {
    if (mode === 'compositions' && compView && compView.start && Object.keys(compView.start).length) { const o = {}; for (const k in compView.start) o[k] = compView.start[k].slice(); return o; }
    const f = data.states[elem().start_state].feet; const o = {}; for (const k in f) o[k] = f[k].slice(); return o;
  }
  function n() { return Math.max(1, elem().steps.length); }
  function selIndices() { const out = []; for (let k = 0; k < sel.len; k++) out.push((sel.start + k) % n()); return out; }
  function selLast() { return (sel.start + sel.len - 1) % n(); }
  function readOnly() { return mode === 'compositions'; }
  // ---------- counts: the steps that land on the same count (of the same element) move together, so the selection and the
  // arrow keys go count by count. The steps of a count are consecutive in every step list.
  function groupKey(s) { return (s.element === undefined ? '' : s.element) + '|' + s.count; }
  function groups() { const st = elem().steps, g = []; st.forEach((s, i) => { if (i && groupKey(st[i - 1]) === groupKey(s)) g[g.length - 1][1]++; else g.push([i, 1]); }); return g; }
  function groupAt(i) { return groups().find(([a, l]) => i >= a && i < a + l) || [i, 1]; }
  function selectCount(i) { const [a, l] = groupAt(i); sel = { start: a, len: l }; }
  function selLastCount() { const e = elem(); if (!e.steps.length) return []; const k = groupKey(e.steps[selLast()]); return selIndices().filter(i => groupKey(e.steps[i]) === k); }
  function moveSelection(key, shift, ctrl) {
    // up/down: the previous or next count; shift: grow by a count at that edge; ctrl+shift: shrink by a count there
    const N = n(); if (!elem().steps.length) return;
    const dir = key === 'ArrowDown' ? 1 : -1, last = selLast();
    if (shift && ctrl) {
      if (dir === 1) { const [a] = groupAt(last); const cut = ((last - a) % N + N) % N + 1; if (cut < sel.len) sel.len -= cut; }
      else { const [a, l] = groupAt(sel.start); const cut = a + l - sel.start; if (cut < sel.len) { sel.start = (sel.start + cut) % N; sel.len -= cut; } }
    } else if (shift) {
      if (sel.len >= N) return;
      if (dir === 1) { const [a, l] = groupAt((last + 1) % N); sel.len = Math.min(N, ((a + l - 1 - sel.start) % N + N) % N + 1); }
      else { const [a] = groupAt((sel.start - 1 + N) % N); sel.len = Math.min(N, sel.len + ((sel.start - a) % N + N) % N); sel.start = a; }
    } else selectCount(dir === 1 ? (last + 1) % N : (sel.start - 1 + N) % N);
  }

  // ---------- geometry helpers
  function px(p) { return [cv.width / 2 + (p[0] - view.cx) * view.scale, cv.height / 2 - (p[1] - view.cy) * view.scale]; }
  function world(sx, sy) { return [(sx - cv.width / 2) / view.scale + view.cx, -(sy - cv.height / 2) / view.scale + view.cy]; }
  // the shoe sole of every picture (dance/shoe.py: SOLE and HEEL, a LEFT shoe; u across, + = the big-toe side; v along,
  // + = the toe; a start point, then cubic segments). The same numbers are in shoe.py and the app's FloorView.kt.
  const SOLE = [[2.6, -3.0], [3.0, 0.5, 4.8, 3.0, 4.6, 6.0], [4.4, 9.5, 2.8, 12.4, 1.2, 13.0], [-0.6, 13.4, -5.2, 8.5, -5.0, 4.5],
                [-4.9, 1.5, -3.6, -1.0, -3.4, -3.0], [-1.5, -2.7, 0.8, -2.7, 2.6, -3.0]];
  const HEEL = [[2.7, -4.4], [2.9, -6.5, 2.9, -9.5, 2.4, -11.0], [1.9, -12.5, 0.9, -13.0, -0.4, -13.0], [-1.8, -13.0, -2.8, -12.4, -3.3, -11.0],
                [-3.8, -9.5, -3.6, -6.5, -3.4, -4.4], [-1.3, -4.1, 0.6, -4.1, 2.7, -4.4]];
  function bezierPts(shape, n) {
    const pts = [shape[0]]; let p0 = shape[0];
    for (const [c1x, c1y, c2x, c2y, ex, ey] of shape.slice(1)) {
      for (let i = 1; i <= n; i++) { const t = i / n, a = (1 - t) ** 3, b = 3 * (1 - t) ** 2 * t, c = 3 * (1 - t) * t * t, d = t ** 3;
        pts.push([a * p0[0] + b * c1x + c * c2x + d * ex, a * p0[1] + b * c1y + c * c2y + d * ey]); }
      p0 = [ex, ey];
    }
    return pts;
  }
  const SHOE_L = [bezierPts(SOLE, 10), bezierPts(HEEL, 10)];
  /** the two pieces of the shoe of a foot (front sole, heel) as world polygons; a right shoe is the mirror */
  function footPoly(x, y, h, side) {
    const f = fwd(h), r = right(h), m = side === 'L' ? 1 : -1;
    return SHOE_L.map(piece => piece.map(([u, v]) => [x + u * m * r[0] + v * f[0], y + u * m * r[1] + v * f[1]]));
  }
  /** the centre of the heel of a foot placed at (x, y, h): the point a foot turns about */
  function heelOf(x, y, h) { const f = fwd(h); return [x - f[0] * HEEL_AXIS, y - f[1] * HEEL_AXIS]; }
  function feetBefore(upto) {
    const e = elem(); const feet = startFeet();
    for (let i = 0; i < upto; i++) { const s = e.steps[i]; feet[s.dancer + '.' + s.foot] = [s.x, s.y, s.heading]; }
    return feet;
  }
  function bbox() {
    const e = elem(); const pts = Object.values(startFeet()).map(p => [p[0], p[1]]);
    e.steps.forEach(s => pts.push([s.x, s.y]));
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
  }
  function fit() {
    const [x0, y0, x1, y1] = bbox();
    view.cx = (x0 + x1) / 2; view.cy = (y0 + y1) / 2;
    view.scale = Math.max(1.2, Math.min(cv.width / (x1 - x0 + 90), cv.height / (y1 - y0 + 90), 6));
    draw();
  }

  // ---------- drawing
  function drawFoot(x, y, h, side, color, alpha, label, outlineOnly, greyBase) {
    const pieces = footPoly(x, y, h, side).map(poly => poly.map(px));
    const path = () => { ctx.beginPath(); for (const poly of pieces) { poly.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); } };
    if (greyBase) { path(); ctx.globalAlpha = 0.2; ctx.fillStyle = '#777'; ctx.fill(); }
    path(); ctx.globalAlpha = alpha;
    if (outlineOnly) { ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke(); }
    else if (alpha > 0.001) { ctx.fillStyle = color; ctx.fill(); }
    ctx.globalAlpha = 1;
    const f = fwd(h);
    if (label) { const tp = px([x + f[0] * (FOOT_LEN / 2 + 6), y + f[1] * (FOOT_LEN / 2 + 6)]); ctx.fillStyle = color; ctx.font = 'bold ' + Math.max(10, view.scale * 5) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, tp[0], tp[1]); }
  }
  function drawGrid() {
    const W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H);
    const g = 20, half = [W / view.scale / 2, H / view.scale / 2];
    ctx.lineWidth = 1;
    for (let x = Math.floor((view.cx - half[0]) / g) * g; x < view.cx + half[0]; x += g) { const p = px([x, 0]); ctx.strokeStyle = x === 0 ? '#bbb' : '#eee'; ctx.beginPath(); ctx.moveTo(p[0], 0); ctx.lineTo(p[0], H); ctx.stroke(); }

        const prev = tr[s.foot].landings[tr[s.foot].landings.length - 1][2];
        if (dist(prev, [s.x, s.y]) < 0.5 && Math.abs(prev[2] - s.heading) < 0.5) release = s.t;
        tr[s.foot].landings.push([s.t, Math.min(release, s.t), [s.x, s.y, s.heading], s.via || []]);
        if (!s.noweight) { const k = wds.indexOf(s), nxt = k + 1 < wds.length ? wds[k + 1].t : s.t + 2, ramp = Math.min(RAMP, RAMP_FRACTION * (nxt - s.t));
          ramps.push([s.t, ramp, s.foot]); lastRampEnd = s.t + ramp; }
      });
      // before the first step: the neutral stance, weight on both feet; it moves onto the foot that stays (the other one
      // steps first) over SHIFT beats, ending as the first foot leaves (user 2026-10-19)
      const firstFoot = ds.length ? ds[0].foot : (d === 'L' ? 'L' : 'R');
      const firstRelease = ds.length ? tr[firstFoot].landings[1][1] : -1e9;
      tracks[d] = { tracks: tr, ramps, w0: firstFoot === 'L' ? 'R' : 'L', shiftEnd: firstRelease };
    }
    const length = composed ? (composed.length || 0) : (e.composition ? (compView.length || 0) : e.beats);
    return { steps, elements, start, startHands, tracks, length, swing, fillers: elements.filter(x => x.filler).length };
  }
  function placementAt(track, t) {
    const L = track.landings; let i = 0;
    for (let j = 0; j < L.length; j++) if (L[j][0] <= t) i = j;
    const [tl, tr, p] = L[i];
    if (i + 1 < L.length) { const [ntl, ntr, np] = L[i + 1];
      if (t >= ntr && t < ntl) { const u = smoothstep((t - ntr) / Math.max(1e-6, ntl - ntr)); const dh = np[2] - p[2];   /* the raw difference: the stored winding chooses the way round */
        const via = L[i + 1][3] || [], q = via.length ? curveAt([[p[0], p[1]]].concat(via, [[np[0], np[1]]]), u) : [p[0] + (np[0] - p[0]) * u, p[1] + (np[1] - p[1]) * u];
        return [q[0], q[1], p[2] + dh * u]; } }
    return p;
  }
  function weightsAt(dt, t) {
    const w = { L: 0, R: 0 }; w[dt.w0] = 1;
    if (dt.shiftEnd !== undefined && t < dt.shiftEnd) {
      const u = smoothstep((t - (dt.shiftEnd - SHIFT)) / SHIFT); const other = dt.w0 === 'L' ? 'R' : 'L';
      w[dt.w0] = 0.5 + 0.5 * u; w[other] = 0.5 - 0.5 * u; return w;
    }
    for (const [tl, ramp, foot] of dt.ramps) { if (t < tl) break; const u = smoothstep((t - tl) / Math.max(1e-6, ramp)); const other = foot === 'L' ? 'R' : 'L';
      if (u >= 1) { w[foot] = 1; w[other] = 0; } else { w[foot] = Math.max(w[foot], u); w[other] = Math.min(w[other], 1 - u); } }
    return w;
  }
  function labelAt(tl, b) {
    const e = tl.elements.find(x => b >= x.start && b < x.start + x.beats); if (!e) return ['', ''];
    const k = tl.elements.indexOf(e); const counts = tl.steps.filter(s => s.element === k).map(s => String(s.count));
    const base = parseInt(counts[0], 10); const rel = b - e.start; const nn = base + Math.floor(rel); const frac = rel - Math.floor(rel);
    return [e.name + (e.filler ? ' — triple step filler' : ''), (frac >= tl.swing - 0.02 && counts.includes(nn + '&')) ? nn + '&' : String(nn)];
  }
  function drawFrame(tl, b) {
    drawGrid();
    if (b < 0) b = -0.001;  // the count-in: every foot at its start position, no weight change yet
    const feet = {}, weights = {};
    for (const d of ['L', 'F']) { for (const f of ['L', 'R']) feet[d + '.' + f] = placementAt(tl.tracks[d].tracks[f], b); weights[d] = weightsAt(tl.tracks[d], b); }
    const order = Object.keys(feet).sort((a, c) => weights[a[0]][a[2]] - weights[c[0]][c[2]]);
    for (const key of order) { const [d, f] = key.split('.'); const p = feet[key]; drawFoot(p[0], p[1], p[2], f, COL[d], weights[d][f], '', false, true); }
    let [name, count] = labelAt(tl, b);
    if (b < 0) { name = 'ready'; count = ''; }
    ctx.fillStyle = name.includes('filler') ? '#8a6d00' : '#222'; ctx.font = '22px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(name || '', 12, 10);
    ctx.fillStyle = '#222'; ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'right'; ctx.fillText(count || '', cv.width - 14, 6);
    ctx.font = '12px sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#999'; ctx.fillText(player.info || '', 12, 38);
  }

  // ---------- the player: Web Audio loops the track segment sample-accurately; the animation follows the audio clock
  const player = { on: false, ctx: null, src: null, buffers: {}, grids: {}, raf: 0, tl: null, k0: 0, s0: 0, t0: 0, off: 0, info: '', loopBeats: 0, closes: false, cam: null, savedView: null, follow: false, lastT: 0 };
  function beatAt(grid, s) { const beats = grid.beats; let j = 0; while (j + 1 < beats.length - 1 && beats[j + 1] <= s) j++; return j + (s - beats[j]) / (beats[j + 1] - beats[j]); }
  async function startPlay() {
    const key = $('track').value;
    if (mode === 'compositions' && !compView) { setStatus('the composition is still loading'); return; }
    if (!elem().steps.length) { setStatus('nothing to play'); return; }
    if (!window.AudioContext && !window.webkitAudioContext) { setStatus('no Web Audio in this browser'); return; }
    setStatus('loading ' + key + '…');
    try {
      if (!player.ctx) player.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (player.ctx.state === 'suspended') await player.ctx.resume();
      if (!player.grids[key]) player.grids[key] = await (await fetch('/api/track/' + key)).json();
      if (!player.buffers[key]) { const ab = await (await fetch('/music/' + key + '.mp3')).arrayBuffer(); player.buffers[key] = await player.ctx.decodeAudioData(ab); }
    } catch (e) { setStatus('could not load the track: ' + e); return; }
    const grid = player.grids[key]; const swing = grid.swing || DEFAULT_SWING;
    // the loop: the element (its chosen starting condition) or the composition, padded by the server with triple-step fillers
    const e = elem();
    const barT0 = (grid.bars || []).find(t => t >= 3.0) || grid.beats[0];
    let k00 = 0; grid.beats.forEach((t, i) => { if (Math.abs(t - barT0) < Math.abs(grid.beats[k00] - barT0)) k00 = i; });
    const chainBeats = Math.max(8, grid.beats.length - k00 + 16);
    const cc = compList()[ci];
    const req = e.composition ? { start_state: cc.start_state, elements: cc.elements, repeat: cc.repeat || 1, pad: true, chain_beats: chainBeats, sub_compositions: subs, stitch: $('stitch').value }
                              : { start_state: e.start_state, leader_free: e.leader_free_start || 'L', elements: [e.name], repeat: 1, pad: true, chain_beats: chainBeats, sub_compositions: [], end: e.end_state, stitch: $('stitch').value };   // the element itself, never a sub-composition of the same name
    let composed;
    try { composed = await (await fetch('/api/compose', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(req) })).json(); }
    catch (err) { setStatus('could not compose the loop: ' + err); return; }
    // play always works (user 2026-10-25): a composition with a problem plays as far as it composes, and the status says why it stops
    const problem = composed.errors && composed.errors.length ? composed.errors.join('; ') : '';
    if (!(composed.steps && composed.steps.length)) { setStatus('nothing to play' + (problem ? ': ' + problem : '')); return; }
    composed.start_state = req.start_state;
    const tl = buildTimeline(swing, composed); if (!(tl.length > 0)) { setStatus('nothing to play'); return; }
    const barT = (grid.bars || []).find(t => t >= 3.0) || grid.beats[0];
    let k0 = 0; grid.beats.forEach((t, i) => { if (Math.abs(t - barT) < Math.abs(grid.beats[k0] - barT)) k0 = i; });
    const bar = grid.beat * 4;
    player.tl = tl; player.k0 = k0; player.s0 = grid.beats[k0]; player.off = Math.max(0, player.s0 - bar);
    const closes = !!composed.closes; const loopBeats = composed.loop_beats || tl.length; const chained = composed.chained || 1;
    const fillersPerLoop = Math.round(tl.fillers / chained);
    player.loopBeats = loopBeats; player.closes = closes;
    player.info = `${loopBeats}-beat loop` + (fillersPerLoop ? `, ${fillersPerLoop} triple step filler${fillersPerLoop > 1 ? 's' : ''}` : '') +
      (closes ? `, danced on from where they are (${chained} times through the track)` : ', restarts from the start position each time (it ends in a different position)') + '; the music runs on. Space or the play button stops.';
    // camera: the whole chain if it fits, otherwise follow the couple
    player.savedView = { cx: view.cx, cy: view.cy, scale: view.scale };
    const xs = tl.steps.map(s => s.x).concat(Object.values(tl.start).map(p => p[0])), ys = tl.steps.map(s => s.y).concat(Object.values(tl.start).map(p => p[1]));
    const bw = Math.max(...xs) - Math.min(...xs) + 120, bh = Math.max(...ys) - Math.min(...ys) + 120;
    const fitScale = Math.min(cv.width / bw, cv.height / bh);
    if (fitScale >= 2.5) { player.follow = false; view.cx = (Math.min(...xs) + Math.max(...xs)) / 2; view.cy = (Math.min(...ys) + Math.max(...ys)) / 2; view.scale = Math.min(fitScale, 5); }
    else { player.follow = true; view.scale = Math.max(3.2, Math.min(view.scale, 5)); player.cam = null; }
    const src = player.ctx.createBufferSource(); src.buffer = player.buffers[key]; src.loop = true; src.loopStart = 0; src.loopEnd = src.buffer.duration; src.connect(player.ctx.destination);
    src.start(0, player.off); player.src = src; player.t0 = player.ctx.currentTime; player.on = true;
    $('play').classList.add('on'); $('play').textContent = 'stop';
    setStatus(`playing ${e.name}: ${player.info}` + (problem ? `
it plays only as far as it composes: ${problem}` : ''));
    const dur = src.buffer.duration;
    const frame = () => { if (!player.on) return; const now = player.ctx.currentTime; const pos = (player.off + (now - player.t0)) % dur; const b = beatAt(grid, pos) - k0;
      let bb;
      if (b < 0) bb = -1;
      else if (player.closes) bb = Math.min(b, tl.length - 1e-6);   // chained: keeps going from where the dancers are
      else bb = b % player.loopBeats;                                 // does not close: restart from the start position
      if (player.follow && bb >= 0) {
        const pts = []; for (const d of ['L', 'F']) for (const f of ['L', 'R']) { const p = placementAt(tl.tracks[d].tracks[f], bb); pts.push(p); }
        const c = [pts.reduce((a, p) => a + p[0], 0) / 4, pts.reduce((a, p) => a + p[1], 0) / 4];
        if (!player.cam) player.cam = c; else { const k = 1 - Math.exp(-(now - player.lastT) / 1.2); player.cam = [player.cam[0] + (c[0] - player.cam[0]) * k, player.cam[1] + (c[1] - player.cam[1]) * k]; }
        view.cx = player.cam[0]; view.cy = player.cam[1];
      }
      player.lastT = now;
      drawFrame(tl, bb); player.raf = requestAnimationFrame(frame); };
    player.raf = requestAnimationFrame(frame);
  }
  function stopPlay() { if (!player.on) return; player.on = false; try { player.src.stop(); } catch (e) {} cancelAnimationFrame(player.raf);
    if (player.savedView) { view.cx = player.savedView.cx; view.cy = player.savedView.cy; view.scale = player.savedView.scale; }
    $('play').classList.remove('on'); $('play').textContent = 'play'; setStatus('stopped'); draw(); }
  function togglePlay() { if (player.on) stopPlay(); else startPlay(); }

  $('play').addEventListener('click', togglePlay);
  $('undo').addEventListener('click', () => { if (!readOnly()) doUndo(); });
  $('fit').addEventListener('click', fit);
  $('render').addEventListener('click', renderVideo);
  $('videoClose').addEventListener('click', () => { $('video').pause(); $('videoWrap').style.display = 'none'; });
  $('element').addEventListener('change', ev => { stopPlay(); if (mode === 'elements') { const cur = data.elements[ei]; selectElement(ev.target.value, cur.start_state, cur.leader_free_start || 'L'); } else { const v = String(ev.target.value); listKind = v[0] === 's' ? 'sub' : 'composition'; ci = parseInt(v.slice(1), 10) || 0; renderCompEdit(); loadComposition(); } });
  $('modeElements').addEventListener('click', () => setMode('elements'));
  $('modeCompositions').addEventListener('click', () => setMode('compositions'));
  window.addEventListener('beforeunload', ev => { if (dirty || compsDirty) { ev.preventDefault(); ev.returnValue = ''; } });

  function fillSelect() {
    const selEl = $('element'); selEl.innerHTML = '';
    if (mode === 'elements') {
      elementNames().forEach(nm => { const o = document.createElement('option'); o.value = nm; o.textContent = `${nm} (${variantsOf(nm).length} starting condition${variantsOf(nm).length > 1 ? 's' : ''})`; selEl.appendChild(o); });
      selEl.value = data.elements[ei].name;
    } else {
      comps.forEach((c, i) => { const o = document.createElement('option'); o.value = 'c' + i; o.textContent = `${c.name} — from ${c.start_state}, ${c.elements.length}${c.repeat > 1 ? ' x ' + c.repeat : ''} entries`; selEl.appendChild(o); });
      subs.forEach((c, i) => { const o = document.createElement('option'); o.value = 's' + i; o.textContent = `sub: ${c.name} — ${c.elements.join(', ')}`; selEl.appendChild(o); });
      selEl.value = (listKind === 'sub' ? 's' : 'c') + ci;
    }
  }
  function setMode(m) {
    stopPlay();
    mode = m; $('modeElements').classList.toggle('on', m === 'elements'); $('modeCompositions').classList.toggle('on', m === 'compositions');
    $('undo').disabled = readOnly();
    if (overlayKind === 'form') closeOverlay();
    fillSelect(); selectCount(0); renderCompEdit(); renderVariant(); renderElemEdit();
    if (m === 'compositions') loadComposition(); else { fit(); refresh(); }
  }
  let composeSeq = 0;
  async function loadComposition() {
    // a composition is always composed afresh from the elements on disk (user 2026-10-25): an element edit that is not saved
    // yet is saved first, so the composition already has it
    compView = null; const c = compList()[ci]; if (!c) { refresh(); return; }
    const seq = ++composeSeq; setStatus('composing ' + c.name + '…');
    if (dirty) { clearTimeout(autosaveTimer); await save(); if (seq !== composeSeq) return; }
    const r = await fetch('/api/compose', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ start_state: c.start_state, elements: c.elements, repeat: c.repeat || 1, sub_compositions: subs, stitch: $('stitch').value }) });
    const v = await r.json(); if (seq !== composeSeq) return;
    compView = v; selectCount(0); fit(); refresh(); renderCompEdit();
    $('compErr').textContent = (v.errors && v.errors.length) ? v.errors.join('; ') : '';
    setStatus(v.errors && v.errors.length ? 'composition error: ' + v.errors.join('; ') : `${c.name}: ${(v.elements || []).length} elements, ${v.length} beats, ends ${v.end_state}`);
  }
  function resize() { const r = cv.getBoundingClientRect(); cv.width = Math.floor(r.width); cv.height = Math.floor(r.height); draw(); }
  window.addEventListener('resize', resize);
  async function checkVersion() {   // the server warns when it runs older code than the files on disk
    try { const j = await (await fetch('/api/version')).json(); if (j && j.stale) { const b = $('stale'); b.style.display = 'block'; b.textContent = 'The server runs older code than the files on disk: restart it (python RunWeb.py) and reload this page.'; } } catch (err) { /* the page still works */ }
  }

  async function pollFile() {
    // nothing unsaved and the file changed on disk: take the new file (the agent or another tab wrote it)
    if (dirty || player.on || drag || !fileVersion) return;
    try { const j = await (await fetch('/api/skeletons_version')).json();
      if (j && j.version && j.version !== fileVersion && !dirty) { const fr = await fetch('/api/skeletons'), doc = await fr.json();
        if (!dirty) { adopt(doc, versionOf(fr), null); baseElems = snapshotElems(data); setStatus('the file changed on disk: the editor now shows it');
          if (mode === 'compositions') loadComposition(); } } } catch (e) {}   // an open composition is composed again from the new elements
  }
  async function load() {
    const fr0 = await fetch('/api/skeletons');
    data = await fr0.json(); fileVersion = versionOf(fr0);
    const converted = unwrapAll(data);
    baseElems = converted ? null : snapshotElems(data);
    if (typeof setInterval === 'function') setInterval(pollFile, 3000);
    try { const doc = await (await fetch('/api/compositions')).json(); comps = doc.compositions || []; subs = doc.sub_compositions || []; } catch (e) { comps = []; subs = []; }
    selectCount(0); fillSelect(); renderCompEdit(); renderVariant(); resize(); fit(); refresh();
    checkVersion();
    setStatus('loaded ' + elementNames().length + ' elements (' + data.elements.length + ' starting conditions) and ' + comps.length + ' compositions');
    if (converted) { markDirty(); setStatus(`converted ${converted} element${converted > 1 ? 's' : ''} to keep the winding of the feet (each foot turns as before)`); }
  }
  function unwrapAll(doc) {
    // as model.unwrap_element: an element without the 'winding' mark gets each heading as the shortest turn from that foot's
    // previous one (how it was danced before 2026-10-25), then the mark; from then on headings keep their winding
    let n = 0;
    for (const e of doc.elements) { if (e.winding) continue; n++;
      const h = {}; for (const k in doc.states[e.start_state].feet) h[k] = doc.states[e.start_state].feet[k][2];
      for (const s of e.steps) { const k = s.dancer + '.' + s.foot; s.heading = Math.round((h[k] + norm(s.heading - h[k])) * 1e6) / 1e6; h[k] = s.heading; }
      e.winding = true; }
    return n;
  }
  load();
})();
</script>
